[package]
name = "mcp-tap"
version = "0.1.0"
edition = "2024"
description = "Transparent stdio proxy, JSON-RPC profiler and token auditor for MCP servers"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "fs", "sync", "time", "signal"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
